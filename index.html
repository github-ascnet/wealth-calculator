<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive asset growth calculator that visualizes annual profits, dividends, and cashflow over a specified period. Perfect for financial planning and investment simulations.">
    <meta name="keywords" content="Asset Growth, Financial Planning, Investment Calculator, Profit Simulation, Dividends, Cashflow">
    <meta name="author" content="Your Name or Company">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Asset Growth Calculation Tool">
    <meta property="og:description" content="Explore and visualize asset growth with customizable annual returns, dividends, and cashflow projections.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wealthcalc.ascnet.ch/">
    <meta property="og:image" content="https://wealthcalc.ascnet.ch/og-image.png">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Asset Growth Calculation Tool">
    <meta name="twitter:description" content="Calculate and visualize asset growth, dividends, and cashflow projections for financial planning.">
    <meta name="twitter:image" content="https://wealthcalc.ascnet.ch/og-image.png">
    <title>Asset Growth Calculator - Visualize Your Financial Future</title>
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="motion.css">
    <noscript><style>.ag-loader { display: none !important; }</style></noscript>
</head>

<body class="ag-page">

    <div id="agLoader" class="ag-loader" aria-hidden="true">
        <div class="ag-loader-card">
            <div class="ag-loader-chart">
                <svg class="ag-loader-layer ag-loader-grid" viewBox="0 0 176 78" preserveAspectRatio="none">
                    <line x1="0" y1="14" x2="176" y2="14"></line>
                    <line x1="0" y1="38" x2="176" y2="38"></line>
                    <line x1="0" y1="62" x2="176" y2="62"></line>
                </svg>
                <div class="ag-loader-reveal">
                    <div class="ag-loader-reveal-inner">
                        <svg class="ag-loader-layer" viewBox="0 0 176 78">
                            <defs>
                                <linearGradient id="agLoaderFill" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#58c4ff" stop-opacity="0.3"></stop>
                                    <stop offset="100%" stop-color="#58c4ff" stop-opacity="0"></stop>
                                </linearGradient>
                            </defs>
                            <path class="ag-loader-area" d="M4,66 C30,63 44,58 62,50 S96,44 112,30 S150,14 172,8 L172,78 L4,78 Z"></path>
                            <path class="ag-loader-line-glow" d="M4,66 C30,63 44,58 62,50 S96,44 112,30 S150,14 172,8"></path>
                            <path class="ag-loader-line" d="M4,66 C30,63 44,58 62,50 S96,44 112,30 S150,14 172,8"></path>
                        </svg>
                    </div>
                </div>
                <svg class="ag-loader-layer" viewBox="0 0 176 78">
                    <circle class="ag-loader-pulse" cx="172" cy="8" r="5"></circle>
                    <circle class="ag-loader-tip" cx="172" cy="8" r="3.2"></circle>
                </svg>
            </div>
            <p class="ag-loader-title">Asset Growth Calculator</p>
        </div>
    </div>

    <div class="ag-tint ag-tint-gain" aria-hidden="true"></div>
    <div class="ag-tint ag-tint-loss" aria-hidden="true"></div>

    <header>
        <h1 class="ag-title" id="titel">Growth-Calculator</h1>
    </header>

    <main>
        <section class="ag-inputs">
            <div class="ag-inputs-inner">
                <div class="ag-form-grid">

                    <div class="ag-field">
                        <div class="ag-label-row">
                            <label for="startkapital" class="ag-label">Starting Capital</label>
                            <button type="button" class="ag-info" aria-label="Info: Starting Capital" data-tooltip="The capital invested at the beginning.">!</button>
                        </div>
                        <input type="number" class="ag-input" id="startkapital" value="100000" min="10000" oninput="validateInput(this); berechneVermoegenVerzoegert()" onfocusout="sanitizeInput(this)">
                    </div>

                    <!-- <div class="ag-field">
                        <div class="ag-label-row">
                            <label for="jaehrlicherInvest" class="ag-label">Yearly Additional Investment (USD)</label>
                            <button type="button" class="ag-info" aria-label="Info: Yearly Additional Investment" data-tooltip="Additional yearly investment in USD you want to risk.">!</button>
                        </div>
                        <input type="number" class="ag-input" id="jaehrlicherInvest" value="0" step="100" min="0" max="100000" oninput="validateInput(this)" onblur="sanitizeInput(this)" />
                    </div> -->

                    <div class="ag-field">
                        <div class="ag-label-row">
                            <label for="jahre" class="ag-label">Years to measure</label>
                            <button type="button" class="ag-info" aria-label="Info: Years to measure" data-tooltip="Number of years for the calculation.">!</button>
                        </div>
                        <input type="number" class="ag-input" id="jahre" value="10" min="1" max="50" oninput="validateInput(this); berechneVermoegenVerzoegert()" onfocusout="sanitizeInput(this)">
                    </div>

                    <div class="ag-field">
                        <div class="ag-label-row">
                            <label for="renditeProJahr" class="ag-label">% Profit by Year</label>
                            <button type="button" class="ag-info" aria-label="Info: % Profit by Year" data-tooltip="Percentage annual return.">!</button>
                        </div>
                        <input type="number" class="ag-input" id="renditeProJahr" value="25" min="0" max="500" oninput="validateInput(this); berechneVermoegenVerzoegert()" onfocusout="sanitizeInput(this)">
                    </div>

                    <div class="ag-field">
                        <div class="ag-label-row">
                            <label for="maxDrawdown" class="ag-label">% Max. Drawdown</label>
                            <button type="button" class="ag-info" aria-label="Info: % Max. Drawdown" data-tooltip="Expected maximum decline from peak to trough in percent (e.g., -30 = minus 30%).">!</button>
                        </div>
                        <input type="number" class="ag-input" id="maxDrawdown" value="-18" min="-100" max="0" step="0.1" oninput="validateInput(this); berechneVermoegenVerzoegert()" onfocusout="sanitizeInput(this)">
                    </div>

                    <div class="ag-field">
                        <div class="ag-label-row">
                            <label for="standardabweichung" class="ag-label">% Standard deviation by Year</label>
                            <button type="button" class="ag-info" aria-label="Info: % Standard deviation by Year" data-tooltip="Average standard deviation of the return in Percentage.">!</button>
                        </div>
                        <input type="number" class="ag-input" id="standardabweichung" value="22" min="0" max="500" oninput="validateInput(this); berechneVermoegenVerzoegert()" onfocusout="sanitizeInput(this)">
                    </div>

                    <div class="ag-field">
                        <div class="ag-label-row">
                            <label for="dividendeProzent" class="ag-label">% Dividends by Year</label>
                            <button type="button" class="ag-info" aria-label="Info: % Dividends by Year" data-tooltip="Percentage dividend based on assets.">!</button>
                        </div>
                        <input type="number" class="ag-input" id="dividendeProzent" value="1.0" min="0" max="10" step="0.1" oninput="validateInput(this); berechneVermoegenVerzoegert()" onfocusout="sanitizeInput(this)">
                    </div>

                    <div class="ag-field">
                        <div class="ag-label-row">
                            <label for="relativerBezug" class="ag-label">% Cashflow p.a.</label>
                            <button type="button" class="ag-info" aria-label="Info: % Cashflow p.a." data-tooltip="Percentage annual payout deducted from assets.">!</button>
                        </div>
                        <input type="number" class="ag-input" id="relativerBezug" value="0" min="0" max="50" oninput="validateInput(this); berechneVermoegenVerzoegert()" onfocusout="sanitizeInput(this)">
                    </div>

                </div>
                <div>
                    <button id="simulateButton" class="ag-button">
                        Start Simulation
                    </button>
                </div>
            </div>
        </section>

        <section class="ag-charts">
            <div class="ag-charts-inner">
                <div id="vermoegenChartContainer" class="ag-chart-box">
                    <svg id="vermoegenChart" role="img" aria-label="Profit chart"></svg>
                </div>
                <div class="ag-kpi">
                    <span id="wachstumProzent" class="ag-kpi-item"></span>
                    <span id="maxDrawdownAnzeige" class="ag-kpi-item"></span>
                    <span id="volatilitaet" class="ag-kpi-item"></span>
                    <span id="totalDividendsCashflow" class="ag-kpi-group">
                        <span id="totalDividendsAnzeige" class="ag-kpi-item"></span>
                        <span id="totalCashflowAnzeige" class="ag-kpi-item"></span>
                    </span>
                </div>
                <div id="bezugDataChartContainer" class="ag-chart-box">
                    <svg id="bezugDataChart" role="img" aria-label="Cashflow and dividends chart"></svg>
                </div>
            </div>
        </section>
    </main>

    <footer class="ag-footer">
        <p>&copy; 2024 ASCNET Solutions GmbH. All rights reserved.</p>
    </footer>

    <script src="charts.js"></script>
    <script src="motion.js"></script>
    <script src="site.js"></script>

</body>

</html>
